<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="50%" stop-color="#0c2136"/>
      <stop offset="100%" stop-color="#0e3a5a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Abyss Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#oceanGrad)" stroke="url(#cyanGlow)" stroke-width="2.5"/>

  <!-- Outer Radar Sweeping Track -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.3"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="4" x2="32" y2="8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="8" y2="32" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="60" y2="32" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized Nautical Compass / Orca Fin Needle -->
  <!-- North Arrow (Bright White / Cyan Glow) -->
  <polygon points="32,12 37,32 32,27" fill="url(#needleGrad)" filter="url(#glow)"/>
  <polygon points="32,12 27,32 32,27" fill="#38bdf8"/>

  <!-- South Arrow (Deep Marine Cyan) -->
  <polygon points="32,52 37,32 32,37" fill="#0284c7"/>
  <polygon points="32,52 27,32 32,37" fill="#0369a1"/>

  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="3.5" fill="#070d14" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
