name: ORCA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        working-directory: ORCA_Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Backend syntax (py_compile)
        working-directory: ORCA_Backend
        run: |
          python -m py_compile agents/*.py models.py main.py orchestrator/*.py data_connectors/*.py
          python -m py_compile test_*.py
      - name: Backend smoke (no key, no network)
        working-directory: ORCA_Backend
        run: |
          python test_run.py || true
          python test_health.py || true
          python test_safety_floor.py || true
          python test_fleet_convergence.py || true
          python test_optimized.py || true

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ORCA UI/package-lock.json'
      - name: Install UI deps
        working-directory: ORCA UI
        run: npm install
      - name: UI typecheck
        working-directory: ORCA UI
        run: npx tsc --noEmit
      - name: UI build
        working-directory: ORCA UI
        run: npm run build
